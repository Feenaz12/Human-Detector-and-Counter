<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Human Detector</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.2);
}

.login-title {
    font-weight: 700;
    color: #0f172a;
}

.form-control {
    border-radius: 12px;
    padding: 12px;
}

.btn-primary {
    background: #0ea5e9;
    border: none;
    font-weight: 600;
    border-radius: 12px;
    padding: 12px;
}
.btn-primary:hover {
    background: #0284c7;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <i class="bi bi-person-video3 fs-1 text-primary"></i>
        <h3 class="login-title mt-2">Human Detector and Counter</h3>
        <p class="text-muted mb-0">Login to continue</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
    </form>

    <p class="text-center mt-4 text-muted">
        Don’t have an account?
        <a href="{{ url_for('signup') }}" class="text-primary">Signup</a>
    </p>
</div>

<!-- ✅ Snackbar (Bootstrap Toasts) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
  <div class="toast text-bg-{{ category }} border-0" data-bs-delay="3000">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
{% endfor %}
{% endwith %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.toast').forEach(toastEl => {
        new bootstrap.Toast(toastEl).show();
    });
});
</script>

</body>
</html>
